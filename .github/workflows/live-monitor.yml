name: live-site monitor

# Bounded, read-only uptime and wiring check for the deployed desk page.
# Runs daily and on manual dispatch. It never deploys or writes anything —
# it fetches the live site and asserts four facts, then reports pass or fail.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run monitor
