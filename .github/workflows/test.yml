name: tests

# Runs the analytics, JSON-LD, and monitor unit tests on every push and PR.
# The live monitor is a separate scheduled job (live-monitor.yml).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
